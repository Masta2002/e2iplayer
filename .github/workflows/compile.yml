name: compile

on:
  push:
    branches: [ python3 ]
  pull_request:
    branches:
      - "*"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10','3.11','3.12','3.13','3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Build plugins, python ${{ matrix.python }}
        run: |
          pip3 install six
          cd IPTVPlayer
          python -m compileall .
